<!doctype html>

<head>
<meta charset="utf-8">

<title>Prueba</title>
<style>body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f6f1ff;color:#1b1530;padding:40px 20px;text-align:center}</style>
</head>
<body>
<p>Preparando la prueba…</p>
<script>
// Prueba: un RECORDATORIO (VTODO) para dentro de 5 minutos, para ver si el iPhone lo agrega como recordatorio.
(function(){
  var u = function(d){ return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
  var now = new Date(), due = new Date(Math.ceil((now.getTime() + 5 * 60000) / 60000) * 60000);
  var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Recordatorios//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTODO','UID:prueba-' + now.getTime() + '@recordatorios','DTSTAMP:' + u(now),
    'SUMMARY:Prueba recordatorio','DTSTART:' + u(due),'DUE:' + u(due),'STATUS:NEEDS-ACTION',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Prueba recordatorio','TRIGGER;VALUE=DATE-TIME:' + u(due),'END:VALARM',
    'END:VTODO','END:VCALENDAR'];
  var ics = L.join('\r\n') + '\r\n';
  var b64 = btoa(unescape(encodeURIComponent(ics))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  location.replace('agregar.html#' + b64);
})();
</script>
</body>
</html>
