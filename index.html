<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tahará">
<meta name="theme-color" content="#efe9ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120f22" media="(prefers-color-scheme: dark)">
<title>Tahará</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --text:#1b1530; --sub:rgba(40,30,70,.62); --faint:rgba(40,30,70,.38);
  --glass:rgba(255,255,255,.34); --glass-strong:rgba(255,255,255,.55);
  --stroke:rgba(255,255,255,.75); --stroke-soft:rgba(255,255,255,.35);
  --shadow:0 18px 40px rgba(60,30,120,.14), 0 2px 8px rgba(60,30,120,.06);
  --accent:#6d4cff; --accent2:#a46bff;
  --nida:#f2557f; --nida-bg:rgba(242,85,127,.18);
  --clean:#18b892; --clean-bg:rgba(24,184,146,.18);
  --mikve:#2f86ff; --mikve-bg:rgba(47,134,255,.18);
  --ona:#f0a020; --ona-bg:rgba(240,160,32,.2);
  --night:rgba(43,42,92,.07); --night-line:rgba(43,42,92,.16);
  --nida-bg2:rgba(214,60,105,.28); --clean-bg2:rgba(16,150,118,.28); --row-line:rgba(60,40,120,.06); --ink:#2e3566; --bar:rgba(255,255,255,.5); --sel-bg:rgba(30,25,60,.07); --pill-a:rgba(255,255,255,.95); --pill-b:rgba(240,234,255,.75); --pill-line:rgba(255,255,255,.95);
  --bg1:#f6f1ff; --bg2:#ffe7f0; --bg3:#e3f4ff;
  --blob1:#c7b4ff; --blob2:#ffb8cf; --blob3:#9fe0ff;
}
@media (prefers-color-scheme:dark){:root{
  --text:#f4f1ff; --sub:rgba(235,228,255,.66); --faint:rgba(235,228,255,.38);
  --glass:rgba(40,32,70,.42); --glass-strong:rgba(60,50,100,.55);
  --stroke:rgba(255,255,255,.22); --stroke-soft:rgba(255,255,255,.1);
  --shadow:0 18px 40px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25);
  --accent:#9b82ff; --accent2:#c08cff;
  --bg1:#100c20; --bg2:#1b1030; --bg3:#0b1a2a;
  --blob1:#4b2fa8; --blob2:#7a2452; --blob3:#145a7a;
  --night:rgba(0,0,20,.28); --night-line:rgba(255,255,255,.12);
  --nida-bg2:rgba(242,85,127,.32); --clean-bg2:rgba(24,184,146,.32); --row-line:rgba(255,255,255,.06); --ink:#d9d4ff; --bar:rgba(30,24,58,.55); --sel-bg:rgba(255,255,255,.1); --pill-a:rgba(120,100,220,.38); --pill-b:rgba(80,60,170,.22); --pill-line:rgba(255,255,255,.18);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:var(--bg1)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:float 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:var(--blob1);top:-20vmax;left:-15vmax}
.bg i:nth-child(2){width:50vmax;height:50vmax;background:var(--blob2);top:30vh;right:-20vmax;animation-delay:-7s}
.bg i:nth-child(3){width:45vmax;height:45vmax;background:var(--blob3);bottom:-20vmax;left:5vmax;animation-delay:-14s}
@keyframes float{to{transform:translate(6vmax,-5vmax) scale(1.12)}}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}

/* ---------- Liquid Glass ---------- */
.glass{
  position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--stroke-soft);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 var(--stroke),inset 0 -1px 1px rgba(255,255,255,.12);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.45),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18));opacity:.55;mix-blend-mode:overlay}
.card{padding:18px;margin-bottom:14px}

header.top{display:flex;align-items:flex-start;justify-content:space-between;margin:4px 4px 16px}
.top h1{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:0}
.top .date{font-size:15px;color:var(--sub);margin-top:4px;line-height:1.35}
.top .date b{color:var(--text);font-weight:600}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;color:var(--text);cursor:pointer}
.round svg{width:22px;height:22px}

/* hero */
.hero{display:flex;gap:18px;align-items:center;padding:22px}
.ring{flex:0 0 112px;height:112px;position:relative}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .num b{font-size:34px;font-weight:800;display:block}
.ring .num small{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:750;letter-spacing:-.3px}
.hero p{margin:0;color:var(--sub);font-size:15px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:5px 10px;border-radius:99px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.p-nida{background:var(--nida-bg);color:var(--nida)} .p-clean{background:var(--clean-bg);color:var(--clean)}
.p-mikve{background:var(--mikve-bg);color:var(--mikve)} .p-ona{background:var(--ona-bg);color:var(--ona)}
.p-ok{background:rgba(109,76,255,.15);color:var(--accent)}

.sec-title{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin:22px 8px 8px}
.row{display:flex;align-items:center;gap:14px;padding:12px 2px}
.row + .row{border-top:1px solid var(--stroke-soft)}
.dot{flex:0 0 38px;height:38px;border-radius:13px;display:grid;place-items:center}
.dot svg{width:20px;height:20px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;font-weight:620}
.row .t span{display:block;font-size:14px;color:var(--sub);margin-top:2px;line-height:1.35}
.row .r{font-size:13px;color:var(--faint);text-align:right;white-space:nowrap}

.btn{appearance:none;border:0;font:inherit;font-size:17px;font-weight:650;border-radius:99px;padding:15px 20px;width:100%;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.chk svg{width:14px;height:14px}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px rgba(109,76,255,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.small{font-size:15px;padding:11px 16px;width:auto}
.btn + .btn{margin-top:10px}
.btns{display:flex;gap:10px} .btns .btn{margin:0}
.danger{color:var(--nida)!important}

/* bedikot */
.bed{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 10px;align-items:center}
.bed .d{font-size:14px;color:var(--sub);font-weight:600}
.bed .d.now{color:var(--accent)}
.bed .dt{font-size:13px;color:var(--faint)}
.chk{border:1.5px solid var(--stroke);background:var(--glass-strong);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:5px}
.chk.on{background:var(--clean);border-color:var(--clean);color:#fff}
.chk:disabled{opacity:.35}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px}
.cal-head h3{margin:0;font-size:21px;font-weight:750}
.cal-head small{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;font-weight:600;color:var(--faint);padding-bottom:4px}
.wd.sh{color:var(--accent)}
.day{aspect-ratio:1/1.18;border-radius:14px;display:flex;flex-direction:column;position:relative;cursor:pointer;border:1.5px solid transparent;overflow:hidden;font-variant-numeric:tabular-nums}
.day .top{flex:1.85;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.day .bot{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--night);border-top:1px dashed var(--night-line)}
.day .g{font-size:17px;font-weight:600;line-height:1.05}
.day .h{font-size:10px;color:var(--sub);margin-top:1px}
.day .bot .n{font-size:10px;color:var(--sub);font-weight:500}
.day .bot svg{width:10px;height:10px;color:var(--ona)}
.day.out{opacity:.28}
.day .st-nida{background:var(--nida-bg)} .day .top.st-nida .g{color:var(--nida)}
.day .st-proj{background:repeating-linear-gradient(135deg,var(--nida-bg) 0 6px,transparent 6px 11px)}
.day .st-clean{background:var(--clean-bg)} .day .top.st-clean .g{color:var(--clean)}
.day .st-mikve{background:var(--mikve-bg)} .day .top.st-mikve .g{color:var(--mikve)}
.day .st-ona{background:var(--ona-bg)} .day .top.st-ona .g{color:var(--ona)}
.day .bot.st-nida,.day .bot.st-clean,.day .bot.st-mikve,.day .bot.st-ona,.day .bot.st-proj{box-shadow:inset 0 0 0 100px var(--night)}
.day .bot.st-ona .n{color:var(--ona);font-weight:700}
.day .ring{box-shadow:inset 0 0 0 2px var(--ona)}
.day .bot.ring{box-shadow:inset 0 0 0 2px var(--ona), inset 0 0 0 100px var(--night)}
.day.today{border-color:var(--accent)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel .top:not([class*="st-"]){background:var(--glass-strong)}
.day .hf{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--clean)}
.ona-b{padding:12px 2px}
.ona-b + .ona-b{border-top:1px solid var(--stroke-soft)}
.ona-b.past{opacity:.45}
.ona-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ona-h b{font-size:16px;font-weight:620}
.ona-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px 4px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.ona-pill svg{width:14px;height:14px}
.ona-pill.n{background:#2b2a5c;color:#ffd66b} .ona-pill.d{background:var(--ona-bg);color:var(--ona)}
.ona-t{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:10px}
.ona-t small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:650}
.ona-t b{display:block;font-size:15px;font-weight:650;white-space:nowrap}
.ona-t span{display:block;font-size:12px;color:var(--sub)}
.ona-t em{display:block;font-style:normal;font-size:14px;font-weight:600;color:var(--accent);margin-top:1px}
.ona-bar{height:6px;border-radius:9px;display:block}
.ona-bar.n{background:linear-gradient(90deg,#f0a020,#2b2a5c 25%,#2b2a5c 75%,#f7c95c)}
.ona-bar.d{background:linear-gradient(90deg,#f7c95c,#f0a020 50%,#f7c95c)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--sub);margin-top:14px;padding:0 4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend .lg-ic svg{width:14px;height:14px;color:var(--ona)}
.lg-split{display:flex;gap:12px;align-items:center;margin:12px 4px 2px;font-size:13px;color:var(--sub);line-height:1.4}
.lg-split b{color:var(--text);font-weight:600}
.lg-split .mini{flex:0 0 38px;height:42px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--stroke-soft);font-size:9px;text-align:center}
.lg-split .mini b{flex:1.85;display:grid;place-items:center;font-weight:600;color:var(--sub)}
.lg-split .mini i{flex:1;display:grid;place-items:center;font-style:normal;background:var(--night);border-top:1px dashed var(--night-line);color:var(--sub)}

/* tab bar */
.calcard{margin:0 -8px;padding:0 4px 14px}
.cwd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--faint);padding:2px 0 6px}
.cwd .sh{color:var(--accent)}
.cr{position:relative;height:84px;display:grid;grid-template-columns:repeat(7,1fr)}
.cr + .cr{border-top:1px solid var(--row-line)}
.cr .bs{position:absolute;z-index:0}
.cc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cc .gn{font-size:20px;font-weight:600;margin-top:9px;width:33px;height:33px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cc .hd{font-size:12px;color:var(--sub);margin-top:-1px;display:flex;align-items:center;gap:2px}
.cc .hn{position:absolute;bottom:7px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:2px}
.cc .mi{width:10px;height:10px;color:var(--ona)}
.cc.out{opacity:.25}
.cc.today .gn{position:relative;color:var(--text)!important;font-weight:600}
.cc.today .gn::after{content:"";position:absolute;left:7px;right:7px;bottom:1px;height:2px;border-radius:2px;background:var(--text)}
.cc.sel:not(.today) .gn{background:var(--sel-bg)}
.cc .hf{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--clean)}
/* Barra de abajo fija, de vidrio, con burbuja que se desliza */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 6px);max-width:520px;margin:0 auto;z-index:20;display:flex;align-items:center;padding:6px 6px;
  border-radius:34px;background:var(--bar);-webkit-backdrop-filter:blur(26px) saturate(210%);backdrop-filter:blur(26px) saturate(210%);
  border:1px solid var(--pill-line);box-shadow:0 14px 40px rgba(60,30,120,.18),0 2px 8px rgba(60,30,120,.08),inset 0 1px 0 rgba(255,255,255,.7)}
nav.tabs button{flex:1;height:50px;border:0;background:none;display:grid;place-items:center;color:var(--sub);cursor:pointer;position:relative;z-index:1;-webkit-tap-highlight-color:transparent;transition:color .3s}
nav.tabs button svg{width:26px;height:26px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button:active svg{transform:scale(.84)}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{transform:scale(1.1) translateY(-1px)}
.tab-pill{position:absolute;top:6px;left:0;height:50px;border-radius:26px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,var(--pill-a),var(--pill-b));border:1px solid var(--pill-line);
  box-shadow:0 8px 22px rgba(109,76,255,.18),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -6px 12px rgba(109,76,255,.06);
  transition:transform .55s cubic-bezier(.34,1.45,.55,1),width .35s ease}
.tab-pill::after{content:"";position:absolute;inset:3px 12% auto;height:40%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
@media (prefers-color-scheme:dark){.tab-pill::after{opacity:.22}}
.tab-pill.squish{animation:squish .5s cubic-bezier(.34,1.45,.55,1)}
@keyframes squish{30%{border-radius:22px / 25px;filter:saturate(1.3)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,40,.28);z-index:40;opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;z-index:41;
  border-radius:34px 34px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--faint);margin:0 auto 14px}
.sheet h3{font-size:22px;margin:0 0 4px;font-weight:750}
.sheet .lead{color:var(--sub);font-size:15px;margin:0 0 16px;line-height:1.4}
label.f{display:block;font-size:13px;font-weight:650;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:16px 4px 8px}
input[type=date],input[type=time],input[type=text],input[type=number]{width:100%;font:inherit;font-size:17px;color:var(--text);padding:14px 16px;border-radius:16px;border:1px solid var(--stroke-soft);background:var(--glass);-webkit-appearance:none;appearance:none;min-height:52px}
.seg{display:flex;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke-soft)}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--sub);padding:11px 8px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--glass-strong);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.1),inset 0 1px 0 var(--stroke)}
.seg button svg{width:18px;height:18px}
.hint{font-size:14px;color:var(--sub);margin:10px 4px 0;line-height:1.45}
.hint b{color:var(--text)}
.he{font-family:"Arial Hebrew","SF Hebrew",system-ui;direction:rtl;unicode-bidi:isolate}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px}
.sw + .sw{border-top:1px solid var(--stroke-soft)}
.sw div b{display:block;font-size:16px;font-weight:600} .sw div span{font-size:13px;color:var(--sub)}
.toggle{flex:0 0 52px;height:32px;border-radius:99px;background:var(--faint);border:0;position:relative;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.toggle.on{background:var(--clean)} .toggle.on::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--sub);line-height:1.5;padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 0}
.chips button{border:1px solid var(--stroke-soft);background:var(--glass);color:var(--text);font:inherit;font-size:14px;padding:6px 12px;border-radius:99px;cursor:pointer}
.notif{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:22px;margin-top:8px}
.notif .ic{flex:0 0 36px;height:36px;border-radius:9px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.notif .ic small{font-size:8px;color:#e5443a;font-weight:700}.notif .ic b{font-size:16px;color:#111}
.notif .tx{flex:1;min-width:0}.notif .tx b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.notif .tx span{font-size:13px;color:var(--sub)}
.notif .tm{font-size:12px;color:var(--faint);align-self:flex-start}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);z-index:60;padding:12px 18px;border-radius:99px;font-size:15px;font-weight:600;transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.toast.show{transform:translate(-50%,0)}
.empty-illu{font-size:15px;color:var(--sub);line-height:1.5}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
/* Letra del sistema (la de antes), peso intermedio: ni muy negrita ni muy fina */
.top h1{font-weight:650;letter-spacing:-.5px}
.top .date b{font-weight:600}
.hero h2{font-weight:600;letter-spacing:-.2px}
.ring .num b{font-weight:600}
.pill,.ona-pill{font-weight:600}
.sec-title{font-weight:600}
.row .t b,.sw div b,.ona-h b,.notif .tx b{font-weight:550}
.ona-t b{font-weight:600}
.btn{font-weight:550} .btn.primary{font-weight:600}
.chk,.seg button{font-weight:550} .seg button.on{font-weight:600}
.cal-head h3{font-weight:600}
.cc .gn{font-weight:500}
.cc.today .gn{font-weight:650}
.cc .hn{font-weight:450!important}
.cwd,label.f,.bed .d{font-weight:600}

</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"><i class="tab-pill" id="tabPill"></i>
  <button data-tab="hoy" class="on" aria-label="Hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/></svg></button>
  <button data-tab="cal" aria-label="Calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
  <button data-tab="hist" aria-label="Historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/><path d="M12 8v4l3 2"/></svg></button>
  <button data-tab="notif" aria-label="Avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
  <button data-tab="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</nav>
<div class="toast glass" id="toast"></div>

<script src="logic.js"></script>
<script>
(function(){
'use strict';
const T = window.TL;
const KEY = 'tahara.v1';

// ---------------- Estado ----------------
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { S = null; }
if (!S) S = { cycles: [], settings: {} };
S.settings = Object.assign({}, T.DEFAULTS, S.settings);
function store(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function save(){ store(); if (typeof queueSync === 'function') queueSync(); }

function sorted(){ return S.cycles.slice().sort((a,b)=> a.onset < b.onset ? -1 : 1); }

let tab = 'hoy';
let calAnchor = T.today(); // una fecha dentro del mes que se muestra
let selDay = T.today();

// ---------------- Formatos ----------------
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fShort = s => { const d = T.parse(s); return cap(d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','')) + ' ' + d.getDate() + '/' + (d.getMonth()+1); };
const fLong = s => cap(T.parse(s).toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long'}));
const hebShort = s => { const h = T.heb(s); return h.day + ' ' + h.month; };
const hebHe = s => { const h = T.heb(s); return T.gematria(h.day) + ' ' + h.monthHe; };
function shkia(s){ const d = T.sunset(s, S.settings.lat, S.settings.lng); return d ? d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}) : '—'; }
function amanecer(s){ const d = T.sunrise(s, S.settings.lat, S.settings.lng); return d ? d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}) : '—'; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ICON = {
  drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 15c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const dot = (cls, icon) => `<div class="dot" style="background:var(--${cls}-bg);color:var(--${cls})">${ICON[icon]}</div>`;

function ring(frac, color, big, small){
  const r = 48, C = 2*Math.PI*r, f = Math.max(0, Math.min(1, frac));
  return `<div class="ring"><svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--stroke-soft)" stroke-width="10"/>
  <circle cx="56" cy="56" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/></svg>
  <div class="num"><div><b>${big}</b><small>${small}</small></div></div></div>`;
}

// Descripción de una oná
function onahText(o){
  if (!o.hd) return o.note || '';
  if (o.onah === 'night') return `De noche: desde el ${fShort(o.gDate)} a las ${shkia(o.gDate)} hasta el ${fShort(o.hd)} al amanecer (${amanecer(o.hd)})`;
  return `De día: el ${fShort(o.hd)}, desde el amanecer (${amanecer(o.hd)}) hasta las ${shkia(o.hd)}`;
}
// Bloque claro: ícono + "de noche/de día" + cuándo empieza y cuándo termina
function onaBlock(o, past){
  if (!o.hd) return `<div class="row">${dot('ona','sun')}<div class="t"><b>${esc(o.label)}</b><span>${esc(o.note || '')}</span></div></div>`;
  const night = o.onah === 'night';
  const from = night ? `${fShort(o.gDate)} · ${shkia(o.gDate)}` : `${fShort(o.hd)} · ${amanecer(o.hd)}`;
  const to = night ? `${fShort(o.hd)} · ${amanecer(o.hd)}` : `${fShort(o.hd)} · ${shkia(o.hd)}`;
  return `<div class="ona-b${past ? ' past' : ''}">
    <div class="ona-h"><span class="ona-pill ${night ? 'n' : 'd'}">${night ? ICON.moon : ICON.sun}${night ? 'De noche' : 'De día'}</span><b>${esc(o.label)}</b></div>
    <div class="ona-t">
      <div><small>Empieza</small><b>${from}</b><em>${hebShort(o.hd)}</em><span>${night ? 'a la shekiá' : 'al amanecer'}</span></div>
      <i class="ona-bar ${night ? 'n' : 'd'}"></i>
      <div style="text-align:right"><small>Termina</small><b>${to}</b><em>${hebShort(o.hd)}</em><span>${night ? 'al amanecer' : 'a la shekiá'}</span></div>
    </div></div>`;
}

// ---------------- Pantalla: Hoy ----------------
function viewHoy(){
  const cy = sorted(), t = T.today(), st = T.status(cy, S.settings, t);
  let h = '';
  if (st.phase === 'empty'){
    h += `<div class="glass card hero fade" style="flex-direction:column;align-items:flex-start">
      <span class="pill p-ok">Bienvenida</span>
      <h2>Todo en un solo lugar</h2>
      <p>Registrá cuándo empezó el período y la app calcula el hefsek tahará, la shivá nekiím, la noche de mikve y las onot perishá, con fecha hebrea y gregoriana.</p>
    </div>
    <button class="btn primary" data-act="new">${ICON.plus} Registrar inicio del período</button>
    <p class="hint" style="text-align:center;margin-top:14px">Los datos quedan guardados sólo en este teléfono.</p>`;
    return h;
  }
  const c = st.cycle, ci = st.info;
  if (!pushOn()) h += pushCardHtml(true);

  if (st.phase === 'nida'){
    const days = S.settings.minDays;
    h += `<div class="glass card hero fade">${ring(Math.min(st.day,days)/days,'var(--nida)',st.day,'día')}
      <div><span class="pill p-nida">Nidá</span><h2>Día ${st.day}</h2>
      <p>Empezó el ${onsetWhen(c)}, ${c.onah==='night'?'de noche':'de día'}.</p></div></div>`;
    h += `<div class="sec-title">Próximo paso</div><div class="glass card" style="padding:4px 16px">
      <div class="row">${dot('clean','check')}<div class="t"><b>Hefsek tahará</b>
      <span>${st.canHefsek ? 'Ya se puede hacer' : 'A partir del ' + fLong(ci.earliestHefsek)}, antes de la shekiá (${shkia(st.canHefsek ? t : ci.earliestHefsek)})</span></div></div></div>`;
    h += `<button class="btn primary" data-act="hefsek">${ICON.check} Registrar hefsek tahará</button>
      <button class="btn glass" data-act="edit" data-id="${c.id}">Corregir el inicio</button>`;
  }
  else if (st.phase === 'hefsek'){
    h += `<div class="glass card hero fade">${ring(0,'var(--clean)','0','de 7')}
      <div><span class="pill p-clean">Hefsek hecho</span><h2>Mañana empieza el día 1</h2>
      <p>La shivá nekiím va del ${fShort(ci.clean[0])} al ${fShort(ci.clean[6])}.</p></div></div>`;
    h += mikveCard(ci) + bedikotCard(c, ci, t) + `<button class="btn glass" data-act="stain">Volví a ver / hubo una mancha</button>`;
  }
  else if (st.phase === 'shiva'){
    h += `<div class="glass card hero fade">${ring(st.day/7,'var(--clean)',st.day,'de 7')}
      <div><span class="pill p-clean">Shivá nekiím</span><h2>${st.tonight ? 'Hoy a la noche: mikve' : 'Día ' + st.day + ' de 7'}</h2>
      <p>${st.tonight ? 'Último día de shivá nekiím. La tevilá es esta noche, después de tzet hakojavim.' : 'Faltan ' + (7-st.day) + ' día' + (7-st.day===1?'':'s') + ' para la mikve.'}</p></div></div>`;
    h += bedikotCard(c, ci, t) + mikveCard(ci);
    if (st.tonight) h += `<button class="btn primary" data-act="mikveDone">${ICON.wave} Ya fui a la mikve</button>`;
    h += `<button class="btn glass" data-act="stain">Volví a ver / hubo una mancha</button>`;
  }
  else if (st.phase === 'mikvePending'){
    h += `<div class="glass card hero fade">${ring(1,'var(--mikve)',ICON.wave.replace('<svg','<svg style="width:34px;height:34px"'),'')}
      <div><span class="pill p-mikve">Mikve</span><h2>¿Ya fuiste a la mikve?</h2>
      <p>La noche de mikve era el ${fShort(ci.mikve)}. Confirmalo para seguir con el calendario.</p></div></div>
      <button class="btn primary" data-act="mikveDone">${ICON.check} Sí, ya fui</button>`;
  }
  else if (st.phase === 'tehora'){
    const next = T.onot(cy, S.settings).find(o => o.gDate && T.diff(o.gDate, t) >= 0);
    const n = next ? T.diff(next.gDate, t) : null;
    h += `<div class="glass card hero fade">${ring(1,'var(--accent)', n===null?'—':n, n===1?'día':'días')}
      <div><span class="pill p-ok">Tehorá</span><h2>${n===0 ? 'Hoy hay oná' : 'Todo en orden'}</h2>
      <p>${next ? (n===0 ? 'Hoy toca separarse en la oná indicada abajo.' : 'Próxima oná perishá en ' + n + ' día' + (n===1?'':'s') + '.') : 'No hay onot pendientes.'}</p></div></div>`;
  }
  if (st.phase !== 'nida') h += onotCard(cy, t);
  if (st.phase === 'tehora' || st.phase === 'mikvePending')
    h += `<button class="btn primary" data-act="new" style="margin-top:6px">${ICON.drop} Registrar nuevo período</button>`;
  return h;
}

function mikveCard(ci){
  return `<div class="sec-title">Mikve</div><div class="glass card" style="padding:4px 16px"><div class="row">${dot('mikve','wave')}
    <div class="t"><b>Noche del ${fLong(ci.mikve)}</b><span>Después de tzet hakojavim · ${hebShort(T.add(ci.mikve,1))} por la noche</span></div></div></div>`;
}

function bedikotCard(c, ci, t){
  const b = c.bedikot || {};
  let rows = '';
  ci.clean.forEach((s,i) => {
    const n = i+1, future = T.diff(s,t) > 0, now = s === t;
    rows += `<div class="d ${now?'now':''}">Día ${n}</div><div class="dt">${fShort(s)}</div>
      <button class="chk ${b[n+'m']?'on':''}" data-act="bed" data-k="${n}m" ${future?'disabled':''}>${b[n+'m']?ICON.check.replace('<svg','<svg width=14 height=14'):''}Mañana</button>
      <button class="chk ${b[n+'t']?'on':''}" data-act="bed" data-k="${n}t" ${future?'disabled':''}>${b[n+'t']?ICON.check.replace('<svg','<svg width=14 height=14'):''}Tarde</button>`;
  });
  const done = Object.values(b).filter(Boolean).length;
  return `<div class="sec-title">Bedikot · ${done} de 14</div><div class="glass card"><div class="bed">${rows}</div>
    <button class="btn glass small" data-act="alarms" style="width:100%;margin-top:14px">${ICON.bell} ${pushOn() && S.settings.pushBedika ? 'Avisos programados · cambiar texto' : 'Agregar recordatorios al calendario'}</button>
    <p class="hint" style="margin:12px 0 0">Si alguna bedika salió con duda, guardá el paño y consultá con el rav.</p></div>`;
}

function onaWhenText(){
  const st = S.settings, w = [];
  if (st.onaPrev) w.push('el día anterior a las ' + st.onaPrevTime);
  if (st.onaSame) w.push('el mismo día a las ' + st.onaSameTime);
  return w.length ? w.join(' y ') : 'sin horario elegido';
}
function onaRemHtml(){
  if (pushOn() && S.settings.pushOna) return `<div class="row" style="border-top:1px solid var(--stroke-soft)">${dot('clean','bell')}
    <div class="t"><b>Aviso automático en todas las onot</b><span>Te avisa ${onaWhenText()}.</span></div>
    <button class="btn glass small" data-act="onaRem" style="width:auto;margin:0">Cambiar</button></div>`;
  if (pushOn()) return `<div class="row" style="border-top:1px solid var(--stroke-soft)">${dot('ona','bell')}
    <div class="t"><b>Avisos de onot apagados</b><span>Prendelos para que te avise en cada oná.</span></div>
    <button class="btn glass small" data-act="onaPushOn" style="width:auto;margin:0">Prender</button></div>`;
  if (pushSupported() || pushNeedsInstall()) return `<button class="btn primary small" data-act="${pushNeedsInstall() ? 'gonotif' : 'pushOn'}" style="width:100%;margin:6px 0 12px">${ICON.bell} Activar avisos automáticos</button>`;
  return `<button class="btn glass small" data-act="onaRem" style="width:100%;margin:6px 0 12px">${ICON.bell} Agregar las onot al calendario</button>`;
}
function onotCard(cy, t){
  const list = T.onot(cy, S.settings);
  if (!list.length) return '';
  let h = `<div class="sec-title">Onot perishá</div><div class="glass card" style="padding:4px 16px">`;
  list.forEach(o => { h += onaBlock(o, o.gDate && T.diff(o.gDate, t) < 0); });
  if (list.some(o => o.gDate && T.diff(o.gDate, t) >= 0)) h += onaRemHtml();
  return h + `</div>`;
}

// ---------------- Pantalla: Calendario ----------------
// Cada fecha del calendario se parte en dos: arriba el día (hasta la shekiá), abajo la noche,
// que ya es el día hebreo siguiente. Estado por "día hebreo" (clave = fecha de su parte de día).
function halfMarks(cy, st, t){
  const day = {}, mikveNight = {}, onaTop = {}, onaBot = {};
  cy.forEach((c, idx) => {
    const ci = T.cycleInfo(c, st), last = idx === cy.length - 1, sh = T.startHd(c);
    const end = c.hefsek || (last ? (T.diff(t, ci.earliestHefsek) > 0 ? t : ci.earliestHefsek) : T.add(sh, 6));
    for (let d = sh; T.diff(end, d) >= 0; d = T.add(d, 1)) day[d] = (!c.hefsek && T.diff(d, t) > 0) ? 'proj' : 'nida';
    if (c.hefsek) { ci.clean.forEach(d => { day[d] = 'clean'; }); mikveNight[T.add(ci.mikve, 1)] = true; }
  });
  T.onot(cy, st).forEach(o => { if (!o.hd) return; if (o.onah === 'night') onaBot[o.gDate] = true; else onaTop[o.hd] = true; });
  return s => {
    const n = T.add(s, 1);
    return { top: day[s] || '', bot: mikveNight[n] ? 'mikve' : (day[n] || ''), onaTop: !!onaTop[s], onaBot: !!onaBot[s] };
  };
}

// Rango del mes que se muestra, según el calendario principal elegido
const hebMode = () => S.settings.calMode === 'heb';
function monthRange(a){
  if (hebMode()) {
    let f = a; while (T.heb(f).day !== 1) f = T.add(f, -1);
    let l = T.add(f, 28); while (T.heb(T.add(l, 1)).day !== 1) l = T.add(l, 1);
    return { first: f, last: l };
  }
  const [y, m] = a.split('-').map(Number);
  return { first: T.iso(new Date(y, m-1, 1, 12)), last: T.iso(new Date(y, m, 0, 12)) };
}
const inRange = (s, r) => T.diff(s, r.first) >= 0 && T.diff(r.last, s) >= 0;
function shiftMonth(dir){ const r = monthRange(calAnchor); calAnchor = dir > 0 ? T.add(r.last, 1) : T.add(r.first, -1); }
const gMonthShort = s => cap(T.parse(s).toLocaleDateString('es-AR',{month:'short'}).replace('.',''));
function viewCal(){
  const cy = sorted(), mk = T.marks(cy, S.settings), t = T.today(), heb = hebMode(), half = halfMarks(cy, S.settings, t);
  const r = monthRange(calAnchor), startW = T.parse(r.first).getDay();
  const start = T.add(r.first, -startW);
  const len = T.diff(r.last, r.first) + 1, weeks = Math.ceil((startW + len)/7);
  let title, sub;
  if (heb) {
    const h = T.heb(r.first); title = `${h.month} ${h.year}`;
    const g1 = T.parse(r.first), g2 = T.parse(r.last), mo = d => cap(d.toLocaleDateString('es-AR',{month:'long'}));
    sub = g1.getMonth() === g2.getMonth() ? `${mo(g1)} ${g1.getFullYear()}` : `${mo(g1)} – ${mo(g2)} ${g2.getFullYear()}`;
  } else {
    const f = T.parse(r.first); title = cap(f.toLocaleDateString('es-AR',{month:'long'})) + ' ' + f.getFullYear();
    const h1 = T.heb(r.first), h2 = T.heb(r.last);
    sub = h1.key===h2.key ? `${h1.month} ${h1.year}` : `${h1.month} – ${h2.month} ${h2.year}`;
  }
  const pct = i => (i / 7 * 100).toFixed(4) + '%';
  const BG = { nida:'var(--nida-bg)', proj:'repeating-linear-gradient(135deg,var(--nida-bg) 0 6px,transparent 6px 11px)', clean:'var(--clean-bg)' };
  const BG2 = { nida:'var(--nida-bg2)', proj:'repeating-linear-gradient(135deg,var(--nida-bg2) 0 6px,transparent 6px 11px)', clean:'var(--clean-bg2)' };
  const FG = { nida:'var(--nida)', proj:'var(--nida)', clean:'var(--clean)' };
  let rows = '';
  for (let w = 0; w < weeks; w++){
    const wk = Array.from({length:7}, (_, i) => T.add(start, w*7 + i));
    const hv = wk.map(d => inRange(d, r) ? half(d) : { top:'', bot:'', onaTop:false, onaBot:false });
    const top = hv.map(x => x.top === 'mikve' ? '' : x.top), bot = hv.map(x => x.bot === 'mikve' ? '' : x.bot);
    let segs = '';
    // Franjas continuas de nidá / shivá nekiím: día arriba, noche (un tono más fuerte) abajo
    for (let i = 0; i < 7; i++){
      if (top[i]) { const L = top[i-1] !== top[i], R = top[i+1] !== top[i];
        segs += `<div class="bs" style="left:${pct(i)};width:${pct(1)};top:6px;height:49px;background:${BG[top[i]]};border-radius:${L?14:0}px ${R?14:0}px ${R && bot[i]!==top[i]?14:0}px ${L && bot[i-1]!==top[i]?14:0}px"></div>`; }
      if (bot[i]) { const L = bot[i-1] !== bot[i], R = bot[i+1] !== bot[i];
        segs += `<div class="bs" style="left:${pct(i)};width:${pct(1)};top:55px;height:23px;background:${BG2[bot[i]]};border-radius:${L && top[i]!==bot[i]?14:0}px ${R && top[i+1]!==bot[i]?14:0}px ${R?14:0}px ${L?14:0}px"></div>`; }
      // Oná y mikve: sólo su día
      if (hv[i].onaTop) segs += `<div class="bs" style="left:calc(${pct(i)} + 4px);width:calc(${pct(1)} - 8px);top:6px;height:49px;background:var(--ona-bg);border-radius:14px 14px 4px 4px"></div>`;
      if (hv[i].onaBot) segs += `<div class="bs" style="left:calc(${pct(i)} + 4px);width:calc(${pct(1)} - 8px);top:55px;height:23px;background:var(--ona-bg);border-radius:4px 4px 14px 14px"></div>`;
      if (hv[i].bot === 'mikve') segs += `<div class="bs" style="left:${pct(i)};width:${pct(1)};top:55px;height:23px;background:var(--mikve-bg);border-radius:${top[i]?0:14}px 14px 14px ${bot[i-1]?0:14}px"></div>`;
    }
    const cells = wk.map((d, i) => {
      const inM = inRange(d, r), x = mk[d] || { onot: [] }, h = hv[i];
      const gd = +d.slice(8), hd = T.heb(d).day, hn = T.heb(T.add(d, 1)).day;
      const big = heb ? hd : gd;
      const small = heb ? (gd === 1 ? '1 ' + gMonthShort(d) : gd) : (hd === 1 ? '1 ' + T.heb(d).month.slice(0,3) : hd);
      const fg = h.onaTop ? 'var(--ona)' : (top[i] ? FG[top[i]] : '');
      const nfg = h.onaBot ? 'var(--ona)' : (h.bot === 'mikve' ? 'var(--mikve)' : (bot[i] ? FG[bot[i]] : ''));
      const cls = 'cc' + (inM ? '' : ' out') + (d === t ? ' today' : '') + (d === selDay ? ' sel' : '');
      return `<div class="${cls}" data-act="sel" data-d="${d}">${x.hefsekFrom && inM ? '<i class="hf"></i>' : ''}
        <span class="gn" style="${fg && d !== t ? 'color:' + fg : ''}">${big}</span>
        <span class="hd">${h.onaTop ? ICON.sun.replace('<svg', '<svg class="mi"') : ''}${small}</span>
        <span class="hn" style="${nfg ? 'color:' + nfg + ';font-weight:650' : ''}">${h.onaBot ? ICON.moon.replace('<svg', '<svg class="mi"') : ''}${heb ? '' : hn}</span></div>`;
    }).join('');
    rows += `<div class="cr">${segs}${cells}</div>`;
  }
  let h = `<div class="seg" style="margin:0 0 12px" data-seg="calmode"><button data-v="greg" class="${heb?'':'on'}">Gregoriano</button><button data-v="heb" class="${heb?'on':''}">Hebreo</button></div>
    <div class="glass calcard fade"><div class="cal-head">
    <button class="round glass" data-act="mprev">${ICON.left}</button>
    <div style="text-align:center"><h3>${title}</h3><small>${sub}</small></div>
    <button class="round glass" data-act="mnext">${ICON.right}</button></div>
    <div class="cwd">${['Dom','Lun','Mar','Mié','Jue','Vie','Sháb'].map((d,i)=>`<span class="${i===6?'sh':''}">${d}</span>`).join('')}</div>
    <div class="calrows">${rows}</div>
    <div class="legend"><span><i style="background:var(--nida)"></i>Nidá</span><span><i style="background:var(--clean)"></i>Shivá nekiím</span>
    <span><i style="background:var(--mikve)"></i>Mikve</span><span><i style="background:var(--ona)"></i>Oná</span></div>
    <p class="hint" style="margin:8px 12px 0;font-size:12px">${heb ? 'Número grande: fecha hebrea · debajo: fecha gregoriana. La franja de abajo es la noche.' : 'Número grande: fecha gregoriana · debajo: fecha hebrea del día · abajo: fecha hebrea desde la shekiá (la noche).'}</p></div>`;
  h += dayDetail(selDay, mk[selDay] || {onot:[]});
  if (!inRange(t, r)) h += `<button class="btn glass" data-act="mtoday">Volver a hoy</button>`;
  return h;
}

function dayDetail(s, x){
  let rows = '';
  if (x.start) rows += `<div class="row">${dot('nida','drop')}<div class="t"><b>Inicio del período</b><span>${x.startCycle && x.startCycle.time ? 'A las ' + x.startCycle.time + ' · ' : ''}${x.startNight ? (x.startCycle && x.startCycle.preDawn ? 'De noche (madrugada)' : 'De noche (después de la shekiá)') : 'De día'}</span></div></div>`;
  else if (x.nida) rows += `<div class="row">${dot('nida','drop')}<div class="t"><b>${x.projected?'Nidá (estimado)':'Nidá'}</b><span>${x.projected?'Hasta que se haga el hefsek':'Separados'}</span></div></div>`;
  if (x.hefsekFrom) rows += `<div class="row">${dot('clean','check')}<div class="t"><b>Primer día posible para el hefsek</b><span>Antes de la shekiá (${shkia(s)})</span></div></div>`;
  if (x.hefsek) rows += `<div class="row">${dot('clean','check')}<div class="t"><b>Hefsek tahará</b><span>Antes de la shekiá (${shkia(s)})</span></div></div>`;
  if (x.clean) rows += `<div class="row">${dot('clean','check')}<div class="t"><b>Shivá nekiím · día ${x.clean} de 7</b><span>Bedikot a la mañana y a la tarde</span></div></div>`;
  if (x.mikve) rows += `<div class="row">${dot('mikve','wave')}<div class="t"><b>Noche de mikve</b><span>Después de tzet hakojavim</span></div></div>`;
  x.onot.forEach(o => rows += onaBlock(o, false));
  if (x.onot.length && T.diff(s, T.today()) >= 0 && pushOn() && S.settings.pushOna)
    rows += `<p class="hint" style="margin:0 2px 12px">🔔 Te avisa automáticamente ${onaWhenText()}.</p>`;
  return `<div class="glass card fade" style="padding:16px 16px 6px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px 6px">
      <b style="font-size:18px">${fLong(s)}</b><span class="he" style="color:var(--sub);font-size:15px">${hebHe(s)}</span></div>
    <div style="color:var(--sub);font-size:14px;padding:0 2px 8px">${T.hebLabel(s)} · shekiá ${shkia(s)}<br>Desde la shekiá ya es ${hebShort(T.add(s,1))}</div>
    ${rows}</div>`;
}

// ---------------- Pantalla: Historial ----------------
function viewHist(){
  const cy = sorted();
  if (!cy.length) return `<div class="glass card empty-illu fade">Todavía no hay períodos registrados.</div><button class="btn primary" data-act="new">${ICON.plus} Registrar inicio del período</button>`;
  let h = `<button class="btn primary" data-act="new" style="margin-bottom:14px">${ICON.plus} Agregar período</button>`;
  for (let i = cy.length-1; i >= 0; i--){
    const c = cy[i], ci = T.cycleInfo(c, S.settings);
    const gap = i>0 ? T.diff(ci.hd, T.startHd(cy[i-1])) + 1 : null;
    h += `<div class="glass card fade"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span class="pill p-nida" style="margin:0">${onsetWhen(c)} · ${c.onah==='night'?'noche':'día'}</span>
      ${gap ? `<span style="font-size:13px;color:var(--sub)">Intervalo: <b style="color:var(--text)">${gap} días</b></span>` : ''}</div>
      <div class="row">${dot('nida','drop')}<div class="t"><b>Inicio</b><span>${fLong(c.onset)} · ${hebShort(ci.hd)}</span></div></div>
      <div class="row">${dot('clean','check')}<div class="t"><b>Hefsek tahará</b><span>${c.hefsek ? fLong(c.hefsek) : 'Pendiente'}</span></div></div>
      <div class="row">${dot('mikve','wave')}<div class="t"><b>Mikve</b><span>${c.mikveDone ? 'Noche del ' + fLong(ci.mikve) : (c.hefsek ? 'Prevista: noche del ' + fLong(ci.mikve) : '—')}</span></div></div>
      <div class="btns" style="margin-top:8px"><button class="btn glass small" style="flex:1" data-act="edit" data-id="${c.id}">Editar</button>
      <button class="btn glass small danger" style="flex:1" data-act="del" data-id="${c.id}">Borrar</button></div></div>`;
  }
  return h;
}

let pillAt = null;
function movePill(){
  const pill = document.getElementById('tabPill'), btn = document.querySelector('#tabs button.on'); if (!pill || !btn) return;

function goTab(t, anchor){ tab = t; render(); if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } else window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ---------------- Sheets ----------------
let scrim, sheet;
function openSheet(html, onMount){
  closeSheet(true);
  scrim = document.createElement('div'); scrim.className = 'scrim';
  sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrim, sheet);
  scrim.onclick = () => closeSheet();
  requestAnimationFrame(() => { scrim.classList.add('show'); sheet.classList.add('show'); });
  if (onMount) onMount(sheet);
}
function closeSheet(now){
  const a = scrim, b = sheet; scrim = sheet = null;
  if (!a) return;
  if (now) { a.remove(); b.remove(); return; }
  a.classList.remove('show'); b.classList.remove('show');
  setTimeout(() => { a.remove(); b.remove(); }, 380);
}
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

function onahSeg(v){
  return `<div class="seg" data-seg="onah"><button data-v="day" class="${v==='day'?'on':''}">${ICON.sun} De día</button><button data-v="night" class="${v==='night'?'on':''}">${ICON.moon} De noche</button></div>`;
}
function wireSeg(root, name, cb){
  root.querySelectorAll(`[data-seg="${name}"] button`).forEach(b => b.onclick = () => {
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.v);
  });
}
// Con la hora en que vino, la app decide sola si fue de día o de noche
function classifyOnset(date, time){
  if (!date || !time) return null;
  const [h, m] = time.split(':').map(Number), at = T.parse(date); at.setHours(h, m || 0, 0, 0);
  const rise = T.sunrise(date, S.settings.lat, S.settings.lng), set = T.sunset(date, S.settings.lat, S.settings.lng);
  if (!rise || !set) return null;
  const near = Math.min(Math.abs(at - set), Math.abs(at - rise)) <= 20 * 60000;
  if (at < rise) return { onah: 'night', preDawn: true, near, why: `${time} es antes del amanecer (${amanecer(date)}): es la noche que empezó el día anterior a la tarde` };
  if (at >= set) return { onah: 'night', preDawn: false, near, why: `${time} es después de la shekiá (${shkia(date)}): cuenta como de noche` };
  return { onah: 'day', preDawn: false, near, why: `${time} es entre el amanecer (${amanecer(date)}) y la shekiá (${shkia(date)}): cuenta como de día` };
}
const onsetHd = (date, onah, preDawn) => onah === 'night' ? (preDawn ? date : T.add(date, 1)) : date;
function onsetHint(date, onah, preDawn, cls){
  if (!date) return '';
  const hd = onsetHd(date, onah, preDawn);
  let h = cls ? `<b>${cls.why}.</b><br>` : (onah === 'night' ? `Después de la shekiá (${shkia(date)}) ya cuenta como el día hebreo siguiente.<br>` : `Shekiá de ese día: ${shkia(date)}.<br>`);
  h += `Fecha hebrea: <b>${T.hebLabel(hd)}</b> · <span class="he">${hebHe(hd)}</span>`;
  if (cls && cls.near) h += `<br><b style="color:var(--nida)">Está muy cerca de la shekiá o del amanecer.</b> Si hay duda, consultá con el rav y, si hace falta, cambiá “De día / De noche” a mano.`;
  return h;
}
const onsetWhen = c => `${fShort(c.onset)}${c.time ? ' a las ' + c.time : ''}`;

function sheetCycle(c){
  const isNew = !c;
  const nowHm = (() => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); })();
  c = c || { onset: T.today(), onah: 'day', time: nowHm };
  let onah = c.onah, preDawn = !!c.preDawn, manual = false;
  openSheet(`<h3>${isNew ? 'Inicio del período' : 'Editar período'}</h3>
    <p class="lead">${isNew ? 'Cargá el día y la hora en que vino. La app calcula todo lo demás.' : 'Corregí lo que haga falta.'}</p>
    <div style="display:flex;gap:10px"><div style="flex:1.4"><label class="f">Fecha</label><input type="date" id="fOnset" value="${c.onset}" max="${T.today()}"></div>
      <div style="flex:1"><label class="f">Hora</label><input type="time" id="fTime" value="${c.time || ''}"></div></div>
    <label class="f">De día o de noche</label>${onahSeg(onah)}
    <p class="hint" id="fHint"></p>
    ${isNew ? '' : `<label class="f">Hefsek tahará</label><input type="date" id="fHef" value="${c.hefsek||''}">
      <div class="sw" style="margin-top:10px"><div><b>Ya fue a la mikve</b><span>Cierra el ciclo</span></div><button class="toggle ${c.mikveDone?'on':''}" id="fMik"></button></div>`}
    <div style="margin-top:22px"><button class="btn primary" id="fSave">Guardar</button><button class="btn glass" id="fCancel">Cancelar</button></div>`,
  root => {
    const dI = root.querySelector('#fOnset'), tI = root.querySelector('#fTime');
    const setSeg = v => root.querySelectorAll('[data-seg="onah"] button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    const upd = () => {
      const cls = manual ? null : classifyOnset(dI.value, tI.value);
      if (cls) { onah = cls.onah; preDawn = cls.preDawn; setSeg(onah); }
      root.querySelector('#fHint').innerHTML = onsetHint(dI.value, onah, preDawn, cls);
    };
    upd(); dI.oninput = () => { manual = false; upd(); }; tI.oninput = () => { manual = false; upd(); };
    wireSeg(root, 'onah', v => { manual = true; onah = v; preDawn = false; upd(); });
    const mik = root.querySelector('#fMik'); if (mik) mik.onclick = () => mik.classList.toggle('on');
    root.querySelector('#fCancel').onclick = () => closeSheet();
    root.querySelector('#fSave').onclick = () => {
      const onset = root.querySelector('#fOnset').value;
      if (!onset) return toast('Elegí una fecha');
      if (isNew){
        const last = sorted().slice(-1)[0];
        if (last && !last.mikveDone && last.hefsek) last.mikveDone = true; // ciclo anterior cerrado
        S.cycles.push({ id: Date.now(), onset, time: tI.value || '', onah, preDawn: onah === 'night' && preDawn, hefsek: null, bedikot: {}, mikveDone: false });
        toast('Período registrado');
      } else {
        const hef = root.querySelector('#fHef').value || null;
        if (hef && T.diff(hef, onset) < 0) return toast('El hefsek no puede ser antes del inicio');
        Object.assign(c, { onset, time: tI.value || '', onah, preDawn: onah === 'night' && preDawn, hefsek: hef, mikveDone: hef ? root.querySelector('#fMik').classList.contains('on') : false });
        toast('Cambios guardados');
      }
      save(); closeSheet(); render();
    };
  });
}

function sheetHefsek(){
  const cy = sorted(), c = cy[cy.length-1], ci = T.cycleInfo(c, S.settings), t = T.today();
  const def = T.diff(t, ci.earliestHefsek) >= 0 ? t : ci.earliestHefsek;
  openSheet(`<h3>Hefsek tahará</h3><p class="lead">Se hace antes de la shekiá. Al día siguiente empieza el primer día de shivá nekiím.</p>
    <label class="f">Fecha del hefsek</label><input type="date" id="fHef" value="${def}" min="${c.onset}">
    <p class="hint" id="fHint"></p>
    <div style="margin-top:22px"><button class="btn primary" id="fSave">${ICON.check} Confirmar hefsek</button><button class="btn glass" id="fCancel">Cancelar</button></div>`,
  root => {
    const inp = root.querySelector('#fHef');
    const upd = () => { const v = inp.value; if (!v) return;
      const early = T.diff(v, ci.earliestHefsek) < 0;
      root.querySelector('#fHint').innerHTML = (early ? `<b style="color:var(--nida)">Atención:</b> es antes del día ${S.settings.minDays} (${fShort(ci.earliestHefsek)}). Consultá con el rav.<br>` : '') +
        `Shekiá: <b>${shkia(v)}</b> · Shivá nekiím: ${fShort(T.add(v,1))} al ${fShort(T.add(v,7))} · Mikve: noche del ${fShort(T.add(v,7))}`; };
    upd(); inp.oninput = upd;
    root.querySelector('#fCancel').onclick = () => closeSheet();
    root.querySelector('#fSave').onclick = () => { if (!inp.value) return; c.hefsek = inp.value; c.bedikot = {}; save(); render();
      if (pushOn() && S.settings.pushBedika) { closeSheet(); toast('Hefsek registrado · avisos programados'); syncPush(true); }
      else { toast('Hefsek registrado'); sheetAlarms(c); } };
  });
}

function sheetStain(){
  const cy = sorted(), c = cy[cy.length-1];
  openSheet(`<h3>Volví a ver</h3><p class="lead">Si apareció sangre o una mancha durante la shivá nekiím, primero consultá con el rav. Según lo que te diga:</p>
    <button class="btn glass" id="sRe">${ICON.check} Hacer un nuevo hefsek</button>
    <p class="hint" style="margin:6px 8px 14px">Se reinicia la shivá nekiím. El inicio del período queda igual.</p>
    <button class="btn glass" id="sNew">${ICON.drop} Es un período nuevo</button>
    <p class="hint" style="margin:6px 8px 14px">Se registra un nuevo inicio y se recalculan las onot.</p>
    <button class="btn glass" id="sCancel">Cancelar</button>`,
  root => {
    root.querySelector('#sCancel').onclick = () => closeSheet();
    root.querySelector('#sRe').onclick = () => { c.hefsek = null; c.bedikot = {}; save(); closeSheet(true); render(); sheetHefsek(); };
    root.querySelector('#sNew').onclick = () => { closeSheet(true); sheetCycle(); };
  });
}

// ---------------- Alarmas de bedika (Calendario del iPhone) ----------------
function bedikaTimes(c){
  const st = S.settings, ci = T.cycleInfo(c, st), out = [];
  const [hh, mm] = String(st.morning || '07:00').split(':').map(Number);
  ci.clean.forEach((s, i) => {
    const m = T.parse(s); m.setHours(hh, mm || 0, 0, 0);
    out.push({ day: i + 1, date: s, slot: 'm', at: m, label: 'mañana' });
    const ss = T.sunset(s, st.lat, st.lng);

const AVISOS = 'https://avisos.luajtahara.workers.dev';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushNeedsInstall = () => isIOS && !navigator.standalone;
const pushOn = () => !!(S.push && S.push.id) && pushSupported() && Notification.permission === 'granted';
const keyBytes = k => { const s = atob(k.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - k.length % 4) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); };
async function api(method, path, body){
  const r = await fetch(AVISOS + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return d;
}
// Todos los avisos que tocan, calculados en el teléfono: sólo hora + texto
function planItems(){
  const st = S.settings, now = Date.now(), out = [];
  const cy = sorted(), c = cy[cy.length - 1];
  if (st.pushBedika && c && c.hefsek && !c.mikveDone)
    bedikaTimes(c).forEach(b => { if (b.at.getTime() > now) out.push({ at: b.at.getTime(), text: alarmText(b.slot, b.day) }); });
  if (st.pushOna) {
    const t = T.today();
    onaItems(T.onot(cy, st).filter(o => o.gDate && T.diff(o.gDate, t) >= 0)).forEach(it => out.push({ at: it.at.getTime(), text: it.text }));
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 80);
}
let syncTimer = null, syncing = false;
function queueSync(){ if (!S.push || !S.push.id) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPush(false), 900); }
async function syncPush(force){
  if (!pushOn() || syncing) return;
  const items = planItems(), hash = JSON.stringify(items);
  if (!force && hash === S.pushHash) return;
  syncing = true;
  try {
    await api('PUT', '/plan', { id: S.push.id, token: S.push.token, items });
    S.pushHash = hash; store();
  } catch (e) {
    if (e.status === 404) { S.push = null; S.pushHash = null; store(); render(); } // el servidor ya no reconoce este teléfono
  } finally { syncing = false; }
}
async function subscribe(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { publicKey } = await api('GET', '/vapid');
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
  }
  const r = await api('POST', '/sub', { subscription: sub.toJSON(), id: S.push && S.push.id, token: S.push && S.push.token });
  S.push = { id: r.id, token: r.token, endpoint: sub.endpoint }; S.pushHash = null; store();
}
async function activatePush(){
  if (!pushSupported()) throw new Error('unsupported');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('denied');
  await subscribe();
  await syncPush(true);
}
async function deactivatePush(){
  try { await api('DELETE', '/sub', { id: S.push.id, token: S.push.token }); } catch (e) {}
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  S.push = null; S.pushHash = null; store();
}
// Al abrir la app: si el iPhone renovó la suscripción, avisarle al servidor; y mandar el plan si cambió
async function checkPush(){
  if (!S.push || !S.push.id || !pushSupported() || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (!sub || sub.endpoint !== S.push.endpoint) await subscribe();
  } catch (e) {}
  syncPush(false);
}
function pushErrorText(e){
  if (e && e.message === 'denied') return isIOS ? 'Las notificaciones están bloqueadas. Activalas en Ajustes del iPhone → Notificaciones → Tahará.' : 'Las notificaciones están bloqueadas. Activalas en los permisos del navegador para esta app.';
  if (e && e.message === 'unsupported') return 'Este teléfono no permite notificaciones de apps web.';
  return 'No se pudo activar. Revisá que tengas internet y probá de nuevo.';
}

function downloadIcs(items){
  const u = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const now = u(new Date());
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Recordatorios//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Recordatorios'];
  items.forEach(it => {
    const txt = icsEsc(it.text);
    L.push('BEGIN:VEVENT', `UID:${it.uid}@recordatorios`, `DTSTAMP:${now}`,
      `DTSTART:${u(it.at)}`, `DTEND:${u(new Date(it.at.getTime() + 10 * 60000))}`,
      `SUMMARY:${txt}`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${txt}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  openIcs(L.join('\r\n') + '\r\n');
}
function onaItems(list){
  const st = S.settings, out = [], now = Date.now();
  const at = (date, hm) => { const [h, m] = String(hm || '08:00').split(':').map(Number); const d = T.parse(date); d.setHours(h, m || 0, 0, 0); return d; };
  const txt = String(st.msgOna || '').trim() || 'Recordatorio';
  list.forEach(o => {
    if (st.onaPrev) out.push({ uid: `o-${o.kind}-${o.gDate}-p`, at: at(T.add(o.gDate, -1), st.onaPrevTime), text: txt, o, when: 'prev' });
    if (st.onaSame) out.push({ uid: `o-${o.kind}-${o.gDate}-s`, at: at(o.gDate, st.onaSameTime), text: txt, o, when: 'same' });
  });
  const seen = new Set();
  return out.filter(it => it.at.getTime() > now && !seen.has(+it.at) && seen.add(+it.at));
}

      <div class="sw"><div><b>Cuidar también el día 31</b><span>Además de la oná benonit del día 30</span></div><button class="toggle ${st.day31?'on':''}" data-tg="day31"></button></div>
      <div class="sw"><div><b>Or zarúa</b><span>Separarse también en la oná anterior</span></div><button class="toggle ${st.orZarua?'on':''}" data-tg="orZarua"></button></div>
    </div>
    <label class="f">Calendario principal</label>
    <div class="seg" data-seg="calmode2"><button data-v="greg" class="${hebMode()?'':'on'}">Gregoriano</button><button data-v="heb" class="${hebMode()?'on':''}">Hebreo</button></div>
    <label class="f">Ubicación para la shekiá</label>
    <div class="glass card" style="padding:14px 16px;margin:0"><b>${esc(st.city)}</b><div style="font-size:13px;color:var(--sub);margin:2px 0 10px">${(+st.lat).toFixed(3)}, ${(+st.lng).toFixed(3)} · hoy amanecer ${amanecer(T.today())} · shekiá ${shkia(T.today())}</div>
      <div class="btns"><button class="btn glass small" style="flex:1" id="sGeo">Usar mi ubicación</button><button class="btn glass small" style="flex:1" id="sBA">Buenos Aires</button></div></div>
    <label class="f">Copia de seguridad</label>
    <div class="btns"><button class="btn glass small" style="flex:1" id="sExp">Exportar</button><button class="btn glass small" style="flex:1" id="sImp">Importar</button></div>
    <input type="file" id="sFile" accept="application/json" hidden>
    <div class="glass card note" style="margin-top:18px">Los datos del ciclo se guardan sólo en este teléfono. Si activás las notificaciones, al servidor de avisos sólo le llega la hora de cada aviso y el texto que elegiste. Exportá una copia de vez en cuando por si cambiás de celular.<br><br>Los cálculos son orientativos y no reemplazan la consulta con el rav.</div>
    <button class="btn glass danger" id="sWipe">Borrar todos los datos</button>
  </div>`;
}
function wireAjustes(root){
  const st = S.settings, q = id => root.querySelector(id);
  wireSeg(root, 'min', v => { st.minDays = +v; save(); });
  wireSeg(root, 'calmode2', v => { st.calMode = v; calAnchor = selDay; save(); });
  root.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { b.classList.toggle('on'); st[b.dataset.tg] = b.classList.contains('on'); save(); });
  q('#sBA').onclick = () => { Object.assign(st, {lat:T.DEFAULTS.lat, lng:T.DEFAULTS.lng, city:'Buenos Aires'}); save(); render(); };
  q('#sGeo').onclick = () => {
    if (!navigator.geolocation) return toast('Ubicación no disponible');
    navigator.geolocation.getCurrentPosition(p => { Object.assign(st, {lat:p.coords.latitude, lng:p.coords.longitude, city:'Mi ubicación'}); save(); render(); toast('Ubicación actualizada'); },
      () => toast('No se pudo obtener la ubicación'));
  };
  q('#sExp').onclick = () => {
    const name = 'copia-' + T.today() + '.json', txt = JSON.stringify(S, null, 2);
    let file = null; try { file = new File([txt], name, { type: 'application/json' }); } catch(e){}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(()=>{});
    else { const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(txt); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  };
  const file = q('#sFile');
  q('#sImp').onclick = () => file.click();
  file.onchange = () => { const f = file.files[0]; if (!f) return; f.text().then(txt => {
    try { const d = JSON.parse(txt); if (!Array.isArray(d.cycles)) throw 0; S = d; S.settings = Object.assign({}, T.DEFAULTS, S.settings); save(); render(); toast('Copia importada'); }
    catch(e){ toast('El archivo no es válido'); } }); };
  q('#sWipe').onclick = () => sheetConfirm('¿Borrar todos los datos?', 'Borrar todo', () => { S = { cycles: [], settings: Object.assign({}, T.DEFAULTS) }; save(); toast('Datos borrados'); });
}

function sheetConfirm(text, okLabel, fn){
  openSheet(`<h3>${text}</h3><p class="lead">Esta acción no se puede deshacer.</p>
    <button class="btn glass danger" id="cOk">${okLabel}</button><button class="btn glass" id="cNo">Cancelar</button>`,
    root => { root.querySelector('#cNo').onclick = () => closeSheet(); root.querySelector('#cOk').onclick = () => { fn(); closeSheet(); render(); }; });
}

// ---------------- Eventos ----------------
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; goTab(b.dataset.tab); };
app.addEventListener('click', e => {
  const b = e.target.closest('[data-seg="calmode"] button'); if (!b) return;
  S.settings.calMode = b.dataset.v; calAnchor = selDay; save(); render();
});
app.onclick = e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, cy = sorted(), last = cy[cy.length-1];
  const byId = id => S.cycles.find(c => String(c.id) === String(id));
  switch (act){
    case 'new': sheetCycle(); break;
    case 'edit': sheetCycle(byId(el.dataset.id)); break;
    case 'del': sheetConfirm('¿Borrar este período?', 'Borrar período', () => { S.cycles = S.cycles.filter(c => String(c.id) !== el.dataset.id); save(); toast('Período borrado'); }); break;
    case 'hefsek': sheetHefsek(); break;
    case 'stain': sheetStain(); break;
    case 'mikveDone': last.mikveDone = true; save(); render(); toast('¡Mazal tov! Ciclo completo'); break;
    case 'bed': { last.bedikot = last.bedikot || {}; const k = el.dataset.k; last.bedikot[k] = !last.bedikot[k]; save(); render(); break; }
    case 'settings': goTab('ajustes'); break;
    case 'alarms': goTab('notif', 'secBed'); break;
    case 'pushOn': if (tab !== 'notif') doActivate(el); break;
    case 'onaRem': sheetOna(); break;
    case 'gonotif': goTab('notif'); break;
    case 'onaPushOn': S.settings.pushOna = true; save(); render(); toast('Avisos de onot prendidos'); break;
    case 'sel': selDay = el.dataset.d; if (!inRange(selDay, monthRange(calAnchor))) calAnchor = selDay; render(); break;
    case 'mprev': case 'mnext': shiftMonth(act === 'mnext' ? 1 : -1); render(); break;
    case 'mtoday': calAnchor = T.today(); selDay = T.today(); render(); break;
  }
};

// Swipe en el calendario
let tx = null;
app.addEventListener('touchstart', e => { if (tab==='cal' && e.target.closest('.calrows')) tx = e.touches[0].clientX; }, {passive:true});
app.addEventListener('touchend', e => { if (tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50){ shiftMonth(dx < 0 ? 1 : -1); render(); } });

// Refrescar al volver a la app (cambia el día)
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkPush(); } });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => checkPush()).catch(()=>{});
})();
</script>
</body>
</html>
